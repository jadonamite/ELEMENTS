<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Ember Hound Test — ELEMENTS</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0c0a09;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        color: #e5e5e5;
      }
      #hound-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
      }
      #hound-ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px 24px;
      }
      .interactive {
        pointer-events: auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .title-group h1 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f97316;
      }
      .title-group p {
        font-size: 12px;
        color: #a8a29e;
        margin-top: 4px;
      }
      .stats-panel {
        background: rgba(28, 25, 23, 0.85);
        border: 1px solid #44403c;
        border-radius: 6px;
        padding: 10px 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
        min-width: 180px;
        text-align: right;
      }
      .stats-panel .highlight {
        color: #38bdf8;
        font-weight: 700;
      }
      .controls-bar {
        display: flex;
        gap: 12px;
        align-items: center;
        background: rgba(28, 25, 23, 0.85);
        border: 1px solid #44403c;
        border-radius: 6px;
        padding: 10px 16px;
        font-size: 13px;
        color: #d6d3d1;
      }
      .btn {
        background: #292524;
        border: 1px solid #57534e;
        color: #fafaf9;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .btn:hover {
        background: #44403c;
        border-color: #f97316;
      }
      .combat-log {
        max-height: 120px;
        overflow-y: hidden;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .log-entry {
        background: rgba(12, 10, 9, 0.75);
        padding: 3px 8px;
        border-radius: 4px;
        border-left: 3px solid #78716c;
      }
      .log-weakspot {
        border-left-color: #eab308;
        color: #fef08a;
        font-weight: bold;
      }
      .log-death {
        border-left-color: #ef4444;
        color: #fca5a5;
      }
      #labels-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5;
      }
      .hound-badge {
        position: absolute;
        transform: translate(-50%, -100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        pointer-events: none;
      }
      .hound-state-text {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 2px 6px;
        border-radius: 3px;
        background: rgba(0, 0, 0, 0.7);
        color: #fdba74;
      }
      .hound-hp-bar {
        width: 60px;
        height: 5px;
        background: #44403c;
        border-radius: 2px;
        overflow: hidden;
      }
      .hound-hp-fill {
        height: 100%;
        background: #ef4444;
        transition: width 0.1s linear;
      }
    </style>
  </head>
  <body>
    <canvas id="hound-canvas"></canvas>
    <div id="labels-container"></div>
    <div id="hound-ui">
      <header>
        <div class="title-group">
          <h1>Ember Hound — M1.11 Monster Prototype</h1>
          <p>WASD to move stand-in target | Left Click to strike nearest hound | Space to reset hounds</p>
        </div>
        <div class="stats-panel">
          <div>FPS: <span id="stat-fps" class="highlight">--</span></div>
          <div>Frame Time: <span id="stat-ms" class="highlight">-- ms</span></div>
          <div>Headroom: <span id="stat-headroom" class="highlight">-- %</span></div>
          <div>Active Hounds: <span id="stat-count" class="highlight">3</span></div>
        </div>
      </header>

      <div class="combat-log" id="combat-log"></div>

      <footer>
        <div class="controls-bar interactive">
          <span>Camera:</span>
          <button id="btn-cam-follow" class="btn">Follow Target</button>
          <button id="btn-cam-free" class="btn">Orbit Cam</button>
          <span style="margin-left: 12px;">Packs:</span>
          <button id="btn-pack-3" class="btn">3 Hounds (1 Pack)</button>
          <button id="btn-pack-9" class="btn">9 Hounds (3 Packs)</button>
          <button id="btn-reset" class="btn" style="margin-left: auto;">Respawn</button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/monsters/hound-test.ts"></script>
  </body>
</html>
